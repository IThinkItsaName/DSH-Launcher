name: CI

# 说明：本仓库目前在本地开发（无远端/无 Release 渠道）。这份工作流的作用是：
#   * 把"构建 + 仓库自测"这条质量门写成可执行的文件，将来推到任何远端（含私有仓库）即生效；
#   * 即使在本地，也可以照抄下面的命令当作提交前检查清单。
# 注意：_verify-p0 工作区级 harness 依赖本机已安装的 dsh 与真实环境，不进 CI。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-selftest:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DshLauncher/DshLauncher.csproj

      # 产品工程是框架依赖单文件（变更集 161：csproj 里 SelfContained=false + PublishSingleFile），
      # 因此构建与自测都按 win-x64 走；发布产物 dist\ 里只有一个 exe（约 3.6 MB），
      # 运行需要目标机预装 .NET 8 Desktop Runtime (x64)。
      - name: Build
        run: dotnet build src/DshLauncher/DshLauncher.csproj -c Release --no-restore

      - name: SelfTest（仓库自带纯逻辑自测：命名规则 / 版本比较 / profile / 任务台账 / 存储边界 / 会话代际）
        run: dotnet run --project tests/DshLauncher.SelfTest/DshLauncher.SelfTest.csproj -c Release

      - name: Publish（框架依赖小包 → dist/DSH Launcher.exe，变更集 169）
        run: dotnet publish src/DshLauncher/DshLauncher.csproj -c Release -o dist

      # 变更集 169 起默认产物就是**一个**文件 dist/DSH Launcher.exe（AssemblyName=DSH Launcher），
      # 不需要任何后续拷贝。变更集 165–168 的自检引导器仍可用源码打「两个文件」版本，但必须显式
      # 给主程序加 -p:AssemblyName="DSH Launcher.App" 并单独 build 引导器；
      # 绝不能把 net48 的引导器复制成 dist/DSH Launcher.exe——那会覆盖主程序。
